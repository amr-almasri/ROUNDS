<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Rounds Admin</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:wght@400;500;600;700&display=swap');

  :root {
    --teal: #0D7A6B; --teal-pressed: #0A5E55; --teal-faint: #E6F5F2;
    --text: #111827; --text-soft: #374151; --text-muted: #6B7280; --text-faint: #9CA3AF;
    --border: #E5E7EB; --hairline: #EDEFF2; --bg: #F9FAFB; --card: #FFFFFF;
    --warning: #991B1B; --warning-faint: #FDECEC; --good: #006300;
    --grid: #e1e0d9; --axis: #c3c2b7;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
    --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
    --radius: 12px; --radius-sm: 8px;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --teal: #2BB39F; --teal-pressed: #22917F; --teal-faint: #12302B;
      --text: #F3F4F6; --text-soft: #D1D5DB; --text-muted: #9CA3AF; --text-faint: #6B7280;
      --border: #2A2D33; --hairline: #24272C; --bg: #0E1013; --card: #171A1F;
      --warning: #F08A8A; --warning-faint: #3A1A1A; --good: #0ca30c;
      --grid: #2c2c2a; --axis: #383835;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
      --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    }
  }
  :root[data-theme="dark"] {
    --teal: #2BB39F; --teal-pressed: #22917F; --teal-faint: #12302B;
    --text: #F3F4F6; --text-soft: #D1D5DB; --text-muted: #9CA3AF; --text-faint: #6B7280;
    --border: #2A2D33; --hairline: #24272C; --bg: #0E1013; --card: #171A1F;
    --warning: #F08A8A; --warning-faint: #3A1A1A; --good: #0ca30c;
    --grid: #2c2c2a; --axis: #383835;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased; font-size: 14px; }
  h1, h2, h3 { font-family: 'Playfair Display', Georgia, serif; font-weight: 600; margin: 0; }
  button, input, select { font-family: inherit; font-size: 13.5px; color: var(--text); }
  a { color: var(--teal); }

  .top { position: sticky; top: 0; z-index: 20; background: var(--bg);
    border-bottom: 1px solid var(--border); }
  .top-inner { max-width: 1280px; margin: 0 auto; padding: 14px 16px 0; }
  .top-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .brand { font-family: 'Playfair Display', Georgia, serif; font-size: 21px; font-weight: 600; flex: 1; min-width: 160px; }
  .brand small { font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: .09em;
    text-transform: uppercase; color: var(--text-muted); margin-left: 8px; }
  .tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 12px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 9px 12px 10px;
    font-weight: 600; color: var(--text-muted); cursor: pointer; white-space: nowrap; }
  .tabs button[aria-selected="true"] { color: var(--teal); border-bottom-color: var(--teal); }
  .tabs .count { display: inline-block; min-width: 18px; padding: 1px 6px; margin-left: 6px; border-radius: 9px;
    background: var(--warning-faint); color: var(--warning); font-size: 11px; }

  main { max-width: 1280px; margin: 0 auto; padding: 20px 16px 60px; }
  .grid { display: grid; gap: 14px; }
  .g-kpi { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
  .g-2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; min-width: 0; }
  .card h3 { font-size: 16px; margin-bottom: 4px; }
  .card .sub { color: var(--text-muted); font-size: 12.5px; margin-bottom: 12px; line-height: 1.45; }
  .section-title { font-size: 19px; margin: 26px 0 12px; }
  .muted { color: var(--text-muted); }
  .faint { color: var(--text-faint); font-size: 12px; }

  .kpi { cursor: default; }
  .kpi .label { font-size: 12px; color: var(--text-muted); font-weight: 600; }
  .kpi .value { font-family: 'Playfair Display', Georgia, serif; font-size: 28px; font-weight: 600; margin: 6px 0 4px; line-height: 1; }
  .kpi .delta { font-size: 12px; font-weight: 600; color: var(--text-muted); }
  .kpi .delta.up { color: var(--good); } .kpi .delta.down { color: var(--warning); }
  .kpi.alert { border-color: var(--warning); }
  .kpi.alert .value { color: var(--warning); }
  .kpi.link { cursor: pointer; } .kpi.link:hover { border-color: var(--teal); }

  .btn { border: 1px solid var(--border); background: var(--card); border-radius: var(--radius-sm);
    padding: 7px 12px; font-weight: 600; cursor: pointer; transition: border-color .15s var(--ease); }
  .btn:hover { border-color: var(--teal); }
  .btn-primary { background: var(--teal); border-color: var(--teal); color: #fff; }
  .btn-primary:hover { background: var(--teal-pressed); }
  .btn:disabled { opacity: .55; cursor: default; }
  select, input[type=text], input[type=search], input[type=email] {
    border: 1px solid var(--border); background: var(--card); border-radius: var(--radius-sm); padding: 7px 10px; }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--teal); outline-offset: 1px; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--border); background: var(--card); border-radius: 999px; padding: 5px 11px;
    font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--text-soft); }
  .chip[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: #fff; }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .toolbar .grow { flex: 1; min-width: 160px; }

  .tbl-wrap { overflow-x: auto; border: 1px solid var(--hairline); border-radius: var(--radius-sm); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--text-muted); padding: 9px 10px; border-bottom: 1px solid var(--border); background: var(--bg);
    cursor: pointer; user-select: none; white-space: nowrap; position: sticky; top: 0; }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  th .arrow { color: var(--teal); margin-left: 3px; }
  td { padding: 8px 10px; border-bottom: 1px solid var(--hairline); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: var(--teal-faint); }
  td.title { min-width: 240px; max-width: 460px; }
  td.wrap { white-space: normal; max-width: 420px; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
    background: var(--hairline); color: var(--text-soft); white-space: nowrap; }
  .pill.good { background: var(--teal-faint); color: var(--teal); }
  .pill.bad { background: var(--warning-faint); color: var(--warning); }
  .more { margin-top: 10px; display: flex; gap: 10px; align-items: center; }

  .bars { display: grid; gap: 7px; }
  .bar-row { display: grid; grid-template-columns: minmax(90px, 38%) 1fr 56px; gap: 10px; align-items: center; font-size: 13px; }
  .bar-row .bl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-soft); }
  .bar-track { height: 10px; border-radius: 0 4px 4px 0; position: relative; }
  .bar-fill { height: 100%; border-radius: 0 4px 4px 0; background: var(--teal); min-width: 2px; }
  .bar-row .bn { text-align: right; font-variant-numeric: tabular-nums; color: var(--text); font-weight: 600; }
  .bar-row:hover .bl { color: var(--text); }

  .chart { position: relative; width: 100%; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--text-soft); margin-bottom: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .legend span.off { opacity: .4; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .tip { position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 8px 10px; font-size: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.12);
    z-index: 5; min-width: 130px; white-space: nowrap; }
  .tip b { display: block; margin-bottom: 4px; }
  .tip div { display: flex; justify-content: space-between; gap: 14px; }
  .tip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 6px; }

  .funnel-row { display: grid; grid-template-columns: 150px 1fr 120px; gap: 12px; align-items: center; margin-bottom: 8px; font-size: 13px; }
  .funnel-bar { height: 26px; background: var(--teal); border-radius: 0 4px 4px 0; min-width: 2px; }
  .funnel-row .drop { color: var(--text-muted); font-size: 12px; text-align: right; }

  .heat td { text-align: center; font-variant-numeric: tabular-nums; font-size: 12px; min-width: 48px; }
  .heat td.lbl { text-align: left; white-space: nowrap; }

  .login { max-width: 400px; margin: 70px auto; }
  .login label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-top: 12px; }
  .login input { width: 100%; margin-top: 6px; padding: 10px 12px; font-size: 15px; }
  .err { margin-top: 12px; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--warning-faint);
    color: var(--warning); font-size: 13px; }
  .empty { color: var(--text-muted); padding: 22px; text-align: center; font-size: 13px; }
  .loading { color: var(--text-muted); padding: 40px; text-align: center; }
  .note { font-size: 12px; color: var(--text-muted); margin-top: 8px; line-height: 1.5; }

  @media (max-width: 640px) {
    .bar-row { grid-template-columns: 34% 1fr 46px; }
    .funnel-row { grid-template-columns: 100px 1fr 74px; }
    .kpi .value { font-size: 24px; }
    .g-kpi { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .kpi { padding: 12px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  "use strict";

  var API = "https://roundsapp.onrender.com";
  if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
    var override = new URLSearchParams(location.search).get("api");
    if (override) API = override;
  }
  var TOKEN_KEY = "rounds_admin_token";
  var root = document.getElementById("root");
  var token = null;
  try { token = sessionStorage.getItem(TOKEN_KEY) || sessionStorage.getItem("rounds_beta_admin_token"); } catch (e) {}

  var TABS = [
    ["overview", "Overview"], ["papers", "Search & papers"], ["content", "Content"],
    ["access", "Access"], ["growth", "Growth"], ["feedback", "Feedback"], ["errors", "Errors"]
  ];
  var RANGES = [[7, "7 days"], [30, "30 days"], [90, "90 days"], [365, "12 months"]];
  var state = { tab: "overview", days: 30, cache: {}, openErrors: 0 };
  var SERIES = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)", "var(--s5)", "var(--s6)", "var(--s7)", "var(--s8)"];

  // ---------------------------------------------------------------- helpers
  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "class") n.className = attrs[k];
      else if (k === "html") n.innerHTML = attrs[k];
      else if (k === "text") n.textContent = attrs[k];
      else if (k.indexOf("on") === 0) n.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  function esc(s) {
    return String(s === null || s === undefined ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function num(n) { return n === null || n === undefined ? "–" : Number(n).toLocaleString(); }
  function pct(r) { return r === null || r === undefined ? "–" : Math.round(r * 100) + "%"; }
  function ratio(a, b) { return b ? a / b : null; }
  function ms(n) { return n === null || n === undefined ? "–" : (n >= 1000 ? (n / 1000).toFixed(1) + " s" : Math.round(n) + " ms"); }
  function when(iso) {
    if (!iso) return "–";
    var d = new Date(iso);
    if (isNaN(d)) return iso;
    var diff = (Date.now() - d) / 60000;
    if (diff < 60) return Math.max(1, Math.round(diff)) + " min ago";
    if (diff < 1440) return Math.round(diff / 60) + " h ago";
    if (diff < 10080) return Math.round(diff / 1440) + " d ago";
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }
  function shortDate(d) {
    var x = new Date(d + (d.length === 10 ? "T00:00:00" : ""));
    return isNaN(x) ? d : x.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }
  var LABELS = {
    search: "Search", digest: "Rounds digest", library: "Library", reader: "Reader", open: "Read tap",
    doi: "DOI", title: "Title", url: "Link", author: "Author", scan: "Scan",
    success: "Found", not_found: "No full text", unresolvable: "Not identified", timeout: "Timed out",
    libkey: "LibKey", proxy: "Library proxy", mock: "Mock", none: "None",
    pdf: "PDF", html: "Webpage", request: "Request", options: "Options", browzine: "BrowZine",
    essential: "Key reading", notable: "Worth a look", background: "Background", unscored: "Unscored",
    peer_reviewed_literature: "Literature", society_update: "Society", industry_update: "Industry",
    regulatory_update: "Regulatory", surgical_technique_video: "Surgical video", cme_opportunity: "CME",
    provincial_news: "Provincial news",
    wrong_paper: "Wrong paper", wont_open: "Wouldn't open", too_slow: "Too slow", other: "Something else",
    no_access: "Couldn't access full text", wrong_article: "Right topic, wrong article",
    not_relevant: "Not relevant", nothing_new: "Nothing new", too_little: "Too little content",
    too_large: "Over 50 MB", timed_out: "Timed out", non_pdf: "Publisher returned a webpage",
    page_copy_failed: "Page copy failed", files_write_failed: "Couldn't write to Files",
    surgeon: "Surgeon", resident: "Resident", medical_student: "Medical student", researcher: "Researcher",
    administrator: "Administrator", read: "Open and read", save: "Save to library"
  };
  function label(k) { return k === null || k === undefined || k === "" ? "–" : (LABELS[k] || k); }

  function api(path, opts) {
    opts = opts || {};
    var headers = { "Content-Type": "application/json" };
    if (token) headers.Authorization = "Bearer " + token;
    return fetch(API + path, { method: opts.method || "GET", headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined })
      .then(function (res) {
        return res.text().then(function (text) {
          var data = null; try { data = text ? JSON.parse(text) : null; } catch (e) {}
          if (!res.ok) {
            var msg = (data && data.detail) || ("Request failed (" + res.status + ")");
            var err = new Error(typeof msg === "string" ? msg : "Request failed");
            err.status = res.status; throw err;
          }
          return data;
        });
      });
  }
  function load(path) {
    var key = path;
    if (!state.cache[key]) state.cache[key] = api(path).catch(function (e) { delete state.cache[key]; throw e; });
    return state.cache[key];
  }
  function csvDownload(name, columns, rows) {
    var lines = [columns.map(function (c) { return c.label; }).join(",")];
    rows.forEach(function (r) {
      lines.push(columns.map(function (c) {
        var v = c.csv ? c.csv(r) : r[c.key];
        v = v === null || v === undefined ? "" : String(v);
        return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
      }).join(","));
    });
    var blob = new Blob([lines.join("\n")], { type: "text/csv" });
    var a = el("a", { href: URL.createObjectURL(blob), download: name + ".csv" });
    document.body.appendChild(a); a.click(); a.remove();
  }

  // ---------------------------------------------------------- components
  function card(title, sub, body) {
    var c = el("div", { class: "card" });
    if (title) c.appendChild(el("h3", { text: title }));
    if (sub) c.appendChild(el("div", { class: "sub", text: sub }));
    if (body) c.appendChild(body);
    return c;
  }

  function kpi(labelText, value, prev, opts) {
    opts = opts || {};
    var c = el("div", { class: "card kpi" + (opts.alert ? " alert" : "") + (opts.onclick ? " link" : ""),
      onclick: opts.onclick || null, title: opts.hint || "" });
    c.appendChild(el("div", { class: "label", text: labelText }));
    c.appendChild(el("div", { class: "value", text: opts.format ? opts.format(value) : num(value) }));
    if (prev !== undefined && prev !== null && value !== null && value !== undefined) {
      var diff = value - prev, cls = "delta";
      var good = opts.lowerIsBetter ? diff < 0 : diff > 0;
      if (diff !== 0) cls += good ? " up" : " down";
      var txt = opts.format === pct
        ? (diff >= 0 ? "+" : "") + Math.round(diff * 100) + " pts"
        : (diff >= 0 ? "+" : "") + num(diff) + (prev ? " (" + (diff >= 0 ? "+" : "") + Math.round(diff / prev * 100) + "%)" : "");
      c.appendChild(el("div", { class: cls, text: txt + " vs previous" }));
    } else if (opts.note) {
      c.appendChild(el("div", { class: "delta", text: opts.note }));
    }
    return c;
  }

  // Horizontal bar list. Direct numeric labels, so no tooltip is needed to read a value.
  function barList(rows, opts) {
    opts = opts || {};
    var wrap = el("div", { class: "bars" });
    if (!rows.length) return el("div", { class: "empty", text: opts.empty || "Nothing in this period." });
    var max = Math.max.apply(null, rows.map(function (r) { return r.value; })) || 1;
    rows.forEach(function (r) {
      var row = el("div", { class: "bar-row", title: r.title || (r.label + ": " + num(r.value)) });
      row.appendChild(el("div", { class: "bl", text: r.label }));
      var track = el("div", { class: "bar-track" });
      track.appendChild(el("div", { class: "bar-fill", style: "width:" + (r.value / max * 100) + "%" +
        (r.color ? ";background:" + r.color : "") }));
      row.appendChild(track);
      row.appendChild(el("div", { class: "bn", text: opts.format ? opts.format(r.value, r) : num(r.value) }));
      wrap.appendChild(row);
    });
    return wrap;
  }

  // Line chart with toggleable legend and a crosshair tooltip. One y-axis only.
  function lineChart(data, series, opts) {
    opts = opts || {};
    var box = el("div", { class: "chart" });
    var hidden = {};
    var legend = el("div", { class: "legend" });
    if (series.length > 1) {
      series.forEach(function (s) {
        var item = el("span", { role: "button", tabindex: "0" }, [el("i", { style: "background:" + s.color }), s.label]);
        item.addEventListener("click", function () {
          hidden[s.key] = !hidden[s.key]; item.classList.toggle("off", !!hidden[s.key]); draw();
        });
        legend.appendChild(item);
      });
      box.appendChild(legend);
    }
    var holder = el("div", { style: "position:relative" });
    box.appendChild(holder);
    var tip = el("div", { class: "tip", style: "display:none" });
    holder.appendChild(tip);
    var H = opts.height || 200, P = { t: 10, r: 12, b: 26, l: 40 };

    function draw() {
      var W = Math.max(280, holder.clientWidth || 600);
      var shown = series.filter(function (s) { return !hidden[s.key]; });
      var max = 0;
      data.forEach(function (d) { shown.forEach(function (s) { max = Math.max(max, d[s.key] || 0); }); });
      max = niceMax(max);
      var x = function (i) { return P.l + (data.length < 2 ? 0 : i * (W - P.l - P.r) / (data.length - 1)); };
      var y = function (v) { return P.t + (H - P.t - P.b) * (1 - v / max); };
      var svg = '<svg viewBox="0 0 ' + W + " " + H + '" height="' + H + '" role="img" aria-label="' + esc(opts.title || "Trend") + '">';
      for (var g = 0; g <= 5; g++) {
        var gv = max * g / 5, gy = y(gv);
        svg += '<line x1="' + P.l + '" x2="' + (W - P.r) + '" y1="' + gy + '" y2="' + gy + '" stroke="var(' + (g ? "--grid" : "--axis") + ')" stroke-width="1"/>';
        svg += '<text x="' + (P.l - 8) + '" y="' + (gy + 4) + '" text-anchor="end" font-size="11" fill="var(--text-muted)">' + num(Math.round(gv)) + "</text>";
      }
      var step = Math.max(1, Math.ceil(data.length / Math.floor((W - P.l) / 70)));
      data.forEach(function (d, i) {
        if (i % step === 0 || i === data.length - 1) {
          svg += '<text x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="11" fill="var(--text-muted)">' + esc(opts.xLabel ? opts.xLabel(d) : shortDate(d.date)) + "</text>";
        }
      });
      shown.forEach(function (s) {

      });

      svg += '<rect x="' + P.l + '" y="0" width="' + (W - P.l - P.r) + '" height="' + H + '" fill="transparent" class="hit"/></svg>';

  // Stacked columns per day (content volume by category).
  function stackedColumns(data, keys, opts) {
    opts = opts || {};

    keys.forEach(function (k, i) { legend.appendChild(el("span", {}, [el("i", { style: "background:" + SERIES[i % 8] }), label(k)])); });
    box.appendChild(legend);
    var holder = el("div", { style: "position:relative" });
    box.appendChild(holder);
    var tip = el("div", { class: "tip", style: "display:none" });
    var H = 220, P = { t: 10, r: 8, b: 26, l: 40 };
    function draw() {
      var W = Math.max(280, holder.clientWidth || 600);
      var max = niceMax(Math.max.apply(null, data.map(function (d) { return d.total; }).concat([1])));
      var bw = (W - P.l - P.r) / data.length, inner = Math.max(2, bw - 3);
      var y = function (v) { return (H - P.t - P.b) * v / max; };
      var svg = '<svg viewBox="0 0 ' + W + " " + H + '" height="' + H + '" role="img" aria-label="Items ingested per day">';
      for (var g = 0; g <= 5; g++) {
        var gy = H - P.b - y(max * g / 5);
        svg += '<line x1="' + P.l + '" x2="' + (W - P.r) + '" y1="' + gy + '" y2="' + gy + '" stroke="var(' + (g ? "--grid" : "--axis") + ')"/>';
        svg += '<text x="' + (P.l - 8) + '" y="' + (gy + 4) + '" text-anchor="end" font-size="11" fill="var(--text-muted)">' + num(Math.round(max * g / 5)) + "</text>";
      }
      var step = Math.max(1, Math.ceil(data.length / Math.floor((W - P.l) / 64)));
      data.forEach(function (d, i) {
        var x0 = P.l + i * bw + 1.5, base = H - P.b;
        keys.forEach(function (k, ki) {
          var v = d.byCategory[k] || 0; if (!v) return;
          var h = y(v);
          svg += '<rect x="' + x0 + '" y="' + (base - h + 1) + '" width="' + inner + '" height="' + Math.max(0, h - 1) + '" fill="' + SERIES[ki % 8] + '"/>';
          base -= h;
        });
        if (!d.total) svg += '<rect x="' + x0 + '" y="' + (H - P.b - 3) + '" width="' + inner + '" height="3" fill="var(--warning)"/>';
        svg += '<rect class="hb" data-i="' + i + '" x="' + (P.l + i * bw) + '" y="0" width="' + bw + '" height="' + H + '" fill="transparent"/>';
        if (i % step === 0) svg += '<text x="' + (x0 + inner / 2) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="11" fill="var(--text-muted)">' + esc(shortDate(d.date)) + "</text>";
      });
      holder.innerHTML = svg + "</svg>"; holder.appendChild(tip);
      holder.querySelectorAll(".hb").forEach(function (r) {
        r.addEventListener("mouseenter", function () {
          var d = data[+r.getAttribute("data-i")];
          tip.innerHTML = "<b>" + esc(shortDate(d.date)) + " · " + num(d.total) + " items</b>" + (d.total ? keys.filter(function (k) { return d.byCategory[k]; }).map(function (k) {
            return '<div><span><i style="background:' + SERIES[keys.indexOf(k) % 8] + '"></i>' + esc(label(k)) + "</span><span>" + num(d.byCategory[k]) + "</span></div>";
          }).join("") : '<div>No items ingested</div>');
          var left = +r.getAttribute("x") + bw + 6; if (left + 180 > W) left = +r.getAttribute("x") - 186;
          tip.style.left = left + "px"; tip.style.top = "8px"; tip.style.display = "";

        r.addEventListener("mouseleave", function () { tip.style.display = "none"; });

    }
    requestAnimationFrame(draw);
    window.addEventListener("resize", draw);

  // Sortable, searchable table with CSV export and progressive "show more".
  function dataTable(columns, rows, opts) {
    opts = opts || {};
    var wrap = el("div");
    var allColumns = columns;
    columns = columns.filter(function (c) { return !c.csvOnly; });
    var sortKey = opts.sort || null, sortDir = opts.sortDir || -1, query = "", limit = opts.pageSize || 25;
    var filters = opts.filters || [];
    var active = {};
    var bar = el("div", { class: "toolbar" });
    if (opts.search !== false) {
      var q = el("input", { type: "search", class: "grow", placeholder: opts.placeholder || "Filter rows", "aria-label": "Filter rows" });
      q.addEventListener("input", function () { query = q.value.toLowerCase(); limit = opts.pageSize || 25; render(); });
      bar.appendChild(q);
    }
    filters.forEach(function (f) {
      var values = {};
      rows.forEach(function (r) { var v = f.value(r); if (v !== null && v !== undefined && v !== "") values[v] = true; });
      var sel = el("select", { "aria-label": f.label });
      sel.appendChild(el("option", { value: "", text: "All " + f.label.toLowerCase() }));
      Object.keys(values).sort().forEach(function (v) { sel.appendChild(el("option", { value: v, text: f.display ? f.display(v) : label(v) })); });
      sel.addEventListener("change", function () { active[f.label] = sel.value; render(); });
      bar.appendChild(sel);
    });
    var csvBtn = el("button", { class: "btn", type: "button", text: "Export CSV" });
    bar.appendChild(csvBtn);
    wrap.appendChild(bar);
    var tw = el("div", { class: "tbl-wrap" }); wrap.appendChild(tw);
    var more = el("div", { class: "more" }); wrap.appendChild(more);

    function visible() {
      var out = rows.filter(function (r) {
        for (var i = 0; i < filters.length; i++) {
          var want = active[filters[i].label];
          if (want && String(filters[i].value(r)) !== want) return false;
        }
        if (!query) return true;
        return columns.some(function (c) {
          var v = c.csv ? c.csv(r) : r[c.key];
          return v !== null && v !== undefined && String(v).toLowerCase().indexOf(query) >= 0;
        });
      });
      if (sortKey) {
        var col = columns.filter(function (c) { return c.key === sortKey; })[0];
        var get = col && col.sortValue ? col.sortValue : function (r) { return r[sortKey]; };
        out = out.slice().sort(function (a, b) {
          var x = get(a), y = get(b);
          if (x === y) return 0; if (x === null || x === undefined) return 1; if (y === null || y === undefined) return -1;

    function render() {

      var html = "<table><thead><tr>" + columns.map(function (c) {
        return '<th data-k="' + c.key + '" class="' + (c.num ? "num" : "") + '">' + esc(c.label) +
          (sortKey === c.key ? '<span class="arrow">' + (sortDir > 0 ? "↑" : "↓") + "</span>" : "") + "</th>";
      }).join("") + "</tr></thead><tbody>";
      if (!list.length) html += '<tr><td colspan="' + columns.length + '"><div class="empty">' + esc(opts.empty || "No rows match.") + "</div></td></tr>";
      list.slice(0, limit).forEach(function (r) {
        html += "<tr>" + columns.map(function (c) {
          var v = c.render ? c.render(r) : esc(c.fmt ? c.fmt(r[c.key], r) : (r[c.key] === null || r[c.key] === undefined ? "–" : r[c.key]));
          return '<td class="' + (c.num ? "num " : "") + (c.cls || "") + '">' + v + "</td>";
        }).join("") + "</tr>";
      });
      tw.innerHTML = html + "</tbody></table>";
      tw.querySelectorAll("th").forEach(function (th) {
        th.addEventListener("click", function () {
          var k = th.getAttribute("data-k");

      if (opts.afterRender) opts.afterRender(tw, list);
      more.innerHTML = "";
      more.appendChild(el("span", { class: "faint", text: "Showing " + Math.min(limit, list.length) + " of " + list.length }));
      if (list.length > limit) more.appendChild(el("button", { class: "btn", type: "button", text: "Show more",
        onclick: function () { limit += 50; render(); } }));

    render();

    return wrap;
  }

    var btn = el("button", { class: "btn btn-primary", type: "submit", style: "width:100%;margin-top:16px;padding:10px", text: "Sign in" });
    form.appendChild(btn);
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      btn.disabled = true; btn.textContent = "Signing in…";
      api("/beta/admin/verify-code", { method: "POST", body: { email: email, code: form.code.value.trim() } })
        .then(function (data) {
          token = data.token;
          try { sessionStorage.setItem(TOKEN_KEY, token); } catch (e) {}
          renderShell();
        })
        .catch(function (err) { btn.disabled = false; btn.textContent = "Sign in"; showErr(c, err.message || "That code is not valid."); });
    });
    c.appendChild(form);
    c.appendChild(el("button", { class: "btn", type: "button", style: "width:100%;margin-top:10px", text: "Use a different email", onclick: function () { renderLogin(null, email); } }));
    root.appendChild(c);
  }
  function showErr(c, msg) {
    var old = c.querySelector(".err"); if (old) old.remove();
    c.appendChild(el("div", { class: "err", text: msg }));
  }

  var hashTab = location.hash.replace("#", "");
  if (TABS.some(function (t) { return t[0] === hashTab; })) state.tab = hashTab;
  try { var savedDays = +localStorage.getItem("rounds_admin_days"); if (savedDays) state.days = savedDays; } catch (e) {}
  window.addEventListener("hashchange", function () {
    var t = location.hash.replace("#", "");
    if (token && t !== state.tab && TABS.some(function (x) { return x[0] === t; })) { state.tab = t; renderTabs(); renderStage(); }
  });
  if (token) renderShell(); else renderLogin();
})();
</script>
</body>
</html>
