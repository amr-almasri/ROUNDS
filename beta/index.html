<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>Rounds — Beta feedback</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap');

  :root {
    --r-teal: #0D7A6B;
    --r-teal-pressed: #0A5E55;
    --r-teal-faint: #E6F5F2;
    --r-text-primary: #111827;
    --r-text-soft: #374151;
    --r-text-muted: #6B7280;
    --r-text-faint: #9CA3AF;
    --r-border: #E5E7EB;
    --r-hairline: #EDEFF2;
    --r-bg: #F9FAFB;
    --r-card: #FFFFFF;
    --r-warning: #991B1B;
    --r-society: #4338CA;
    --r-industry: #92400E;
    --r-regulatory: #991B1B;
    --r-surgical: #1E3A5F;
    --r-cme: #1D4ED8;
    --r-literature: #15803D;
    --r-tier-key: #0D7A6B;
    --r-tier-notable: #1D4ED8;
    --r-tier-background: #64748B;

    --radius-card: 12px;
    --radius-control: 10px;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
    --fast: 0.15s;
    --base: 0.2s;
    --slow: 0.55s;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    background: var(--r-bg);
    color: var(--r-text-primary);
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, .serif { font-family: 'Playfair Display', Georgia, serif; font-weight: 600; }

  a { color: var(--r-teal); }

  .wrap { max-width: 680px; margin: 0 auto; padding: 0 20px 80px; }
  .wrap-wide { max-width: 1060px; }

  /* ---------- masthead ---------- */
  .masthead {
    position: sticky; top: 0; z-index: 20;
    background: rgba(249, 250, 251, 0.92);
    backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid var(--r-hairline);
  }
  .masthead-inner {
    max-width: 680px; margin: 0 auto; padding: 14px 20px 12px;
    display: flex; align-items: center; gap: 12px;
  }
  .masthead-inner.wide { max-width: 1060px; }
  .masthead img { height: 20px; width: auto; display: block; }
  .masthead .eyebrow {
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--r-text-faint); padding-left: 12px; border-left: 1px solid var(--r-border);
  }
  .masthead .spacer { flex: 1; }

  .progress-track { height: 3px; background: var(--r-hairline); }
  .progress-fill {
    height: 100%; background: var(--r-teal); width: 0;
    transition: width var(--slow) var(--ease);
  }
  .progress-meta {
    max-width: 680px; margin: 0 auto; padding: 8px 20px 10px;
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11.5px; color: var(--r-text-faint);
  }
  .progress-meta strong { color: var(--r-text-muted); font-weight: 600; }

  /* ---------- cards + type ---------- */
  .card {
    background: var(--r-card); border: 1px solid var(--r-border);
    border-radius: var(--radius-card); padding: 22px;
    box-shadow: 0 1px 3px rgba(17, 24, 39, 0.04);
  }
  .card + .card { margin-top: 14px; }

  .step-eyebrow {
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--r-teal); margin-bottom: 8px;
  }
  .step-title { font-size: 27px; line-height: 1.2; margin: 0 0 8px; }
  .step-intro { font-size: 15px; line-height: 1.55; color: var(--r-text-muted); margin: 0 0 22px; max-width: 52ch; }

  .q { padding: 20px 0; border-top: 1px solid var(--r-hairline); }
  .q:first-of-type { border-top: none; padding-top: 4px; }
  .q-label { font-size: 15.5px; font-weight: 600; line-height: 1.4; margin-bottom: 3px; }
  .q-help { font-size: 13px; color: var(--r-text-muted); line-height: 1.5; margin-bottom: 12px; }
  .q-optional { font-size: 11px; font-weight: 500; color: var(--r-text-faint); margin-left: 6px; }

  /* ---------- scale ---------- */
  .scale { display: flex; gap: 6px; }
  .scale button {
    flex: 1; min-width: 0; padding: 13px 0;
    font-family: inherit; font-size: 15px; font-weight: 600;
    color: var(--r-text-soft); background: var(--r-card);
    border: 1px solid var(--r-border); border-radius: var(--radius-control);
    cursor: pointer; transition: all var(--fast) var(--ease);
  }
  .scale button:hover { border-color: var(--r-teal); color: var(--r-teal); }
  .scale button[aria-pressed="true"] {
    background: var(--r-teal); border-color: var(--r-teal); color: #fff;
  }
  .scale.nps button { padding: 11px 0; font-size: 13.5px; }
  .scale-anchors {
    display: flex; justify-content: space-between; margin-top: 8px;
    font-size: 12.5px; font-weight: 500; color: var(--r-text-soft);
  }

  /* ---------- chips / options ---------- */
  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .opts button {
    font-family: inherit; font-size: 13.5px; font-weight: 500;
    color: var(--r-text-soft); background: var(--r-card);
    border: 1px solid var(--r-border); border-radius: 999px;
    padding: 9px 15px; cursor: pointer; transition: all var(--fast) var(--ease);
    display: inline-flex; align-items: center; gap: 0;
  }
  .opts button:hover { border-color: var(--r-teal); color: var(--r-teal); }
  .opts button[aria-pressed="true"] {
    background: var(--r-teal); border-color: var(--r-teal); color: #fff;
  }
  /* The tick collapses to zero width when unselected, so an unselected label
     sits centred instead of shifted off-centre by a reserved slot. */
  .tick {
    width: 0; opacity: 0; flex-shrink: 0; overflow: hidden;
    transition: width var(--fast) var(--ease), opacity var(--fast) var(--ease),
                margin-right var(--fast) var(--ease);
  }
  .opts button[aria-pressed="true"] .tick { width: 13px; opacity: 1; margin-right: 7px; }
  /* Full-width rows keep every label on the same left edge, so the tick moves
     to the trailing end rather than indenting the one that is selected. */
  .opts.stack .tick { order: 2; }
  .opts.stack button[aria-pressed="true"] .tick { margin-right: 0; margin-left: auto; }

  .opts.stack { flex-direction: column; }
  .opts.stack button {
    border-radius: var(--radius-control); width: 100%;
    justify-content: flex-start; text-align: left; padding: 13px 15px; font-size: 14.5px;
  }

  /* ---------- gate (used / not used) ---------- */
  .gate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .gate button {
    font-family: inherit; font-size: 14px; font-weight: 600;
    padding: 15px 10px; line-height: 1.3;
    color: var(--r-text-soft); background: var(--r-card);
    border: 1px solid var(--r-border); border-radius: var(--radius-control);
    cursor: pointer; transition: all var(--fast) var(--ease);
  }
  .gate button small { display: block; font-size: 11.5px; font-weight: 400; color: var(--r-text-faint); margin-top: 3px; }
  .gate button:hover { border-color: var(--r-teal); }
  .gate button[aria-pressed="true"] { background: var(--r-teal); border-color: var(--r-teal); color: #fff; }
  .gate button[aria-pressed="true"] small { color: rgba(255,255,255,0.78); }
  @media (max-width: 520px) { .gate { grid-template-columns: 1fr; } .gate button small { display: inline; margin-left: 6px; } }

  /* ---------- text ---------- */
  textarea, input[type="text"], input[type="email"], input[type="password"] {
    width: 100%; font-family: inherit; font-size: 14.5px; color: var(--r-text-primary);
    background: var(--r-card); border: 1px solid var(--r-border);
    border-radius: var(--radius-control); padding: 12px 14px; resize: vertical;
    transition: border-color var(--fast) var(--ease);
  }
  textarea:focus, input:focus { outline: none; border-color: var(--r-teal); }
  textarea { min-height: 88px; line-height: 1.5; }
  .char-count { font-size: 11px; color: var(--r-text-faint); text-align: right; margin-top: 5px; }

  /* ---------- buttons ---------- */
  .btn {
    font-family: inherit; font-size: 15px; font-weight: 600;
    padding: 13px 26px; border-radius: var(--radius-control); border: 1px solid transparent;
    cursor: pointer; transition: all var(--fast) var(--ease);
  }
  .btn-primary { background: var(--r-teal); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--r-teal-pressed); }
  .btn-primary:disabled { background: var(--r-border); color: var(--r-text-faint); cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--r-text-muted); border-color: var(--r-border); }
  .btn-ghost:hover { color: var(--r-teal); border-color: var(--r-teal); }
  .btn-sm { font-size: 12.5px; padding: 8px 14px; }
  .btn-danger { background: transparent; color: var(--r-warning); border-color: #F3D6D6; }
  .btn-danger:hover { background: #FEF2F2; }

  .nav { display: flex; align-items: center; gap: 12px; margin-top: 26px; }
  .nav .spacer { flex: 1; }
  .nav-hint { font-size: 12px; color: var(--r-text-faint); }

  /* ---------- feature mock ---------- */
  .feature-head { display: flex; gap: 22px; align-items: center; margin-bottom: 4px; }
  .feature-copy { flex: 1; min-width: 0; }
  .mock {
    flex-shrink: 0; width: 176px; background: var(--r-bg);
    border: 1px solid var(--r-border); border-radius: 14px; padding: 11px;
    display: flex; flex-direction: column; gap: 7px;
  }
  @media (max-width: 640px) {
    .feature-head { flex-direction: column-reverse; align-items: stretch; gap: 16px; }
    .mock { width: 100%; }
  }
  .m-row { display: flex; align-items: center; gap: 7px; }
  .m-card {
    background: var(--r-card); border: 1px solid var(--r-border); border-radius: 8px;
    padding: 8px 9px; display: flex; flex-direction: column; gap: 5px;
  }
  .m-title { font-family: 'Playfair Display', Georgia, serif; font-size: 10.5px; font-weight: 600; line-height: 1.3; color: var(--r-text-primary); }
  .m-meta { font-size: 8px; color: var(--r-text-faint); letter-spacing: 0.03em; }
  .m-bar { height: 5px; border-radius: 3px; background: var(--r-hairline); }
  .m-field {
    background: var(--r-card); border: 1px solid var(--r-border); border-radius: 999px;
    padding: 6px 10px; font-size: 9px; color: var(--r-text-faint);
    display: flex; align-items: center; gap: 6px;
  }
  .m-pill {
    display: inline-flex; align-items: center; gap: 4px; border-radius: 999px;
    padding: 3px 7px; font-size: 8px; font-weight: 600; letter-spacing: 0.03em;
  }
  .m-pill-teal { background: var(--r-teal-faint); color: var(--r-teal); }
  .m-btn {
    background: var(--r-teal); color: #fff; border-radius: 6px; text-align: center;
    padding: 6px 0; font-size: 9px; font-weight: 600;
  }
  .m-stripe { width: 3px; border-radius: 2px; align-self: stretch; }
  .m-seg {
    display: flex; background: var(--r-hairline); border-radius: 7px; padding: 2px; gap: 2px;
  }
  .m-seg div { flex: 1; text-align: center; font-size: 7.5px; font-weight: 600; padding: 4px 0; border-radius: 5px; color: var(--r-text-muted); }
  .m-seg div.on { background: var(--r-card); color: var(--r-text-primary); box-shadow: 0 1px 2px rgba(17,24,39,0.06); }
  .m-score {
    display: flex; align-items: center; gap: 8px;
  }
  .m-score-num { font-family: 'Playfair Display', Georgia, serif; font-size: 17px; font-weight: 600; color: var(--r-tier-key); line-height: 1; }
  .m-score-ring { position: relative; width: 42px; height: 42px; flex-shrink: 0; display: grid; place-items: center; }
  .m-score-ring svg { position: absolute; inset: 0; }
  .m-notice {
    background: var(--r-card); border: 1px solid var(--r-border); border-radius: 8px;
    padding: 7px 8px; display: flex; gap: 6px; align-items: center;
  }

  /* ---------- misc ---------- */
  .callout {
    background: var(--r-teal-faint); border-radius: var(--radius-control);
    padding: 14px 16px; font-size: 13.5px; line-height: 1.55; color: var(--r-text-soft);
  }
  .fade-in { animation: fade 0.36s var(--ease) both; }
  @keyframes fade { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .fade-in { animation: none; }
    * { transition-duration: 0.01ms !important; }
  }
  .hidden { display: none !important; }
  .center { text-align: center; }
  .muted { color: var(--r-text-muted); font-size: 13.5px; line-height: 1.55; }
  .err {
    background: #FEF2F2; border: 1px solid #F3D6D6; color: var(--r-warning);
    border-radius: var(--radius-control); padding: 11px 14px; font-size: 13.5px; margin-top: 14px;
  }

  /* ---------- admin ---------- */
  .admin-tabs { display: flex; gap: 6px; margin-bottom: 18px; }
  .admin-tabs button {
    font-family: inherit; font-size: 13.5px; font-weight: 600; padding: 9px 16px;
    border-radius: 999px; border: 1px solid var(--r-border); background: var(--r-card);
    color: var(--r-text-muted); cursor: pointer; transition: all var(--fast) var(--ease);
  }
  .admin-tabs button[aria-pressed="true"] { background: var(--r-teal); border-color: var(--r-teal); color: #fff; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th {
    text-align: left; font-size: 10.5px; font-weight: 600; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--r-text-faint); padding: 0 10px 10px; white-space: nowrap;
  }
  td { padding: 12px 10px; border-top: 1px solid var(--r-hairline); vertical-align: middle; }
  td.actions { text-align: right; white-space: nowrap; }
  .table-scroll { overflow-x: auto; }

  .status {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
    padding: 4px 10px; border-radius: 999px;
  }
  .status-open { background: var(--r-hairline); color: var(--r-text-muted); }
  .status-done { background: var(--r-teal-faint); color: var(--r-teal); }
  .status-revoked { background: #FEF2F2; color: var(--r-warning); }

  .form-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .form-row label { flex: 1; min-width: 160px; font-size: 12px; font-weight: 600; color: var(--r-text-muted); }
  .form-row label input { margin-top: 6px; }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .stat {
    background: var(--r-bg); border: 1px solid var(--r-border); border-radius: var(--radius-control);
    padding: 14px;
  }
  .stat-num { font-family: 'Playfair Display', Georgia, serif; font-size: 26px; font-weight: 600; line-height: 1; }
  .stat-label { font-size: 11.5px; color: var(--r-text-muted); margin-top: 6px; }

  .summary-row { padding: 12px 0; border-top: 1px solid var(--r-hairline); }
  .summary-row:first-child { border-top: none; }
  .summary-q { font-size: 13.5px; font-weight: 600; margin-bottom: 8px; }
  .bar-line { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; font-size: 12.5px; }
  .bar-line .bl-label { width: 190px; flex-shrink: 0; color: var(--r-text-muted); }
  .bar-line .bl-track { display: block; flex: 1; height: 8px; background: var(--r-hairline); border-radius: 4px; overflow: hidden; }
  .bar-line .bl-fill { display: block; height: 8px; background: var(--r-teal); border-radius: 4px; }
  .bar-line .bl-n { width: 34px; text-align: right; color: var(--r-text-faint); font-size: 11.5px; }
  @media (max-width: 560px) { .bar-line .bl-label { width: 110px; } }

  details.resp { border-top: 1px solid var(--r-hairline); padding: 12px 0; }
  details.resp summary { cursor: pointer; font-size: 14px; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 10px; }
  details.resp summary::-webkit-details-marker { display: none; }
  details.resp .ans { margin-top: 12px; }
  .ans-row { display: flex; gap: 12px; padding: 7px 0; border-top: 1px dashed var(--r-hairline); font-size: 13px; }
  .ans-row .ak { width: 220px; flex-shrink: 0; color: var(--r-text-muted); }
  .ans-row .av { color: var(--r-text-primary); }
  @media (max-width: 560px) { .ans-row { flex-direction: column; gap: 2px; } .ans-row .ak { width: auto; } }

  .quote { border-left: 2px solid var(--r-border); padding-left: 12px; margin: 6px 0; font-size: 13px; color: var(--r-text-soft); line-height: 1.5; }
  .quote cite { display: block; font-style: normal; font-size: 11.5px; color: var(--r-text-faint); margin-top: 3px; }
</style>
</head>

<body>
<div id="root"></div>

<script>
(function () {
  "use strict";

  var API = "https://roundsapp.onrender.com";
  var root = document.getElementById("root");

  // ---------------------------------------------------------------------
  // helpers
  // ---------------------------------------------------------------------
  function el(html) { var t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }
  function esc(s) {
    return String(s === null || s === undefined ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function qs(name) { return new URLSearchParams(location.search).get(name); }

  function api(path, opts) {
    opts = opts || {};
    var headers = { "Content-Type": "application/json" };
    if (opts.token) headers["Authorization"] = "Bearer " + opts.token;
    return fetch(API + path, {
      method: opts.method || "GET",
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (res) {
      return res.text().then(function (text) {
        var data = null;
        try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
        if (!res.ok) {
          var msg = (data && (data.detail || data.message)) || ("Request failed (" + res.status + ")");
          var err = new Error(typeof msg === "string" ? msg : "Request failed");
          err.status = res.status;
          throw err;
        }
        return data;
      });
    });
  }

  var TEAL = "var(--r-teal)";
  function segmentedO(size, lw, color) {
    size = size || 30; lw = lw || 2.6; color = color || TEAL;
    var r = (size - lw) / 2, c = 2 * Math.PI * r, period = c / 6;
    var dash = period * 0.74, gap = period * 0.26;
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" aria-hidden="true">' +
      '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + color +
      '" stroke-width="' + lw + '" stroke-linecap="round" stroke-dasharray="' + dash.toFixed(2) + ' ' + gap.toFixed(2) +
      '" stroke-dashoffset="' + (gap / 2).toFixed(2) + '" transform="rotate(-90 ' + size / 2 + ' ' + size / 2 + ')" /></svg>';
  }
  var TICK = '<svg class="tick" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4.5 4.5L19 7"/></svg>';

  function masthead(label, wide) {
    return '<div class="masthead"><div class="masthead-inner' + (wide ? " wide" : "") + '">' +
      '<img src="/rounds-wordmark.svg" alt="Rounds" />' +
      '<span class="eyebrow">' + esc(label) + '</span><span class="spacer"></span>' +
      '<span id="mast-slot"></span></div>' +
      '<div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>' +
      '<div class="progress-meta" id="progress-meta"></div></div>';
  }

  // ---------------------------------------------------------------------
  // feature mini-mocks — same tokens as the app, drawn not screenshotted
  // ---------------------------------------------------------------------
  var MOCKS = {
    search:
      '<div class="m-field">' + '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>' +
      'Title, DOI, or a link</div>' +
      '<div class="m-card"><div class="m-row" style="justify-content:space-between;align-items:flex-start">' +
      '<div class="m-title" style="flex:1">Outcomes of early versus delayed fixation…</div>' +
      '<svg width="10" height="10" viewBox="0 0 24 24" fill="' + TEAL + '"><path d="M6 4h12v16l-6-4-6 4V4Z"/></svg></div>' +
      '<div class="m-meta">J BONE JOINT SURG · 2026</div>' +
      '<div class="m-btn">Read</div></div>',
    access:
      '<div class="m-row" style="gap:5px"><span class="m-pill m-pill-teal">' + segmentedO(8, 1.6) + ' McMaster</span>' +
      '<span class="m-meta">connected</span></div>' +
      '<div class="m-card" style="gap:6px"><div class="m-bar" style="width:80%"></div><div class="m-bar" style="width:100%"></div>' +
      '<div class="m-bar" style="width:92%"></div><div class="m-bar" style="width:64%"></div>' +
      '<div class="m-meta" style="margin-top:2px">FULL TEXT · PDF</div></div>',
    pdf:
      '<div class="m-card" style="flex-direction:row;align-items:center;gap:7px">' +
      '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="' + TEAL + '" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v10m0 0 4-4m-4 4-4-4M5 19h14"/></svg>' +
      '<div style="flex:1"><div class="m-title" style="font-size:9.5px">Save PDF</div>' +
      '<div class="m-meta">to your Files</div></div></div>' +

  var QUESTION_LABELS = {};
  var OPTION_LABELS = {};
  STEPS.forEach(function (s) {
    (s.questions || []).forEach(function (q) {
      QUESTION_LABELS[q.id] = q.label;
      if (q.options) {
        OPTION_LABELS[q.id] = {};
        q.options.forEach(function (o) { OPTION_LABELS[q.id][o.v] = o.label; });
      }
    });

  // =====================================================================
  // TESTER SIDE
  // =====================================================================
  // The short variant asks the same survey minus two feature sections.
  var SHORT_OMITS = ["pdf", "library"];

  function stepsForVariant(variant) {
    if (variant !== "short") return STEPS;
    return STEPS.filter(function (s) { return SHORT_OMITS.indexOf(s.id) === -1; });
  }

  function runSurvey(token) {
    var storeKey = "rounds_beta_v1_" + token;
    var steps = STEPS;
    var answers = {};
    var stepIndex = 0;
    var startedAt = Date.now();
    var intro = null;

    try {
      var saved = JSON.parse(localStorage.getItem(storeKey) || "null");
      if (saved && saved.answers) { answers = saved.answers; stepIndex = saved.stepIndex || 0; }
    } catch (e) { /* a corrupt draft is not worth blocking on */ }

    function persist() {
      try { localStorage.setItem(storeKey, JSON.stringify({ answers: answers, stepIndex: stepIndex })); } catch (e) {}
    }

    function visibleQuestions(step) {
      return (step.questions || []).filter(function (q) { return !q.showIf || q.showIf(answers); });
    }

    root.innerHTML = masthead("Beta feedback") + '<div class="wrap"><div id="stage"></div></div>';
    var stage = document.getElementById("stage");

    function setProgress() {
      var pct = Math.round((stepIndex / (steps.length - 1)) * 100);
      document.getElementById("progress-fill").style.width = pct + "%";
      var meta = document.getElementById("progress-meta");
      if (stepIndex === 0 || stepIndex >= steps.length) { meta.innerHTML = ""; return; }
      meta.innerHTML = '<span>Step <strong>' + stepIndex + '</strong> of ' + (steps.length - 1) + '</span>' +
        '<span>' + pct + '% complete · saved on this device</span>';
    }

    // ----- question renderers -----
    function renderQuestion(q) {
      var wrap = el('<div class="q"></div>');
      var label = '<div class="q-label">' + esc(q.label) +
        '</div>';
      wrap.insertAdjacentHTML("beforeend", label);
      if (q.help) wrap.insertAdjacentHTML("beforeend", '<div class="q-help">' + esc(q.help) + '</div>');

      if (q.type === "scale") {
        var box = el('<div></div>');
        var row = el('<div class="scale' + (q.nps ? " nps" : "") + '"></div>');
        for (var i = q.min; i <= q.max; i++) {
          (function (val) {
            var b = el('<button type="button" aria-pressed="' + (answers[q.id] === val) + '">' + val + '</button>');
            b.addEventListener("click", function () { answers[q.id] = val; persist(); render(); });
            row.appendChild(b);
          })(i);
        }
        box.appendChild(row);
        box.insertAdjacentHTML("beforeend",
          '<div class="scale-anchors"><span>' + esc(q.low) + '</span><span>' + esc(q.high) + '</span></div>');
        wrap.appendChild(box);
      }

      else if (q.type === "gate") {
        var g = el('<div class="gate"></div>');
        q.options.forEach(function (o) {
          var b = el('<button type="button" aria-pressed="' + (answers[q.id] === o.v) + '">' + esc(o.label) +
            (o.note ? '<small>' + esc(o.note) + '</small>' : "") + '</button>');
          b.addEventListener("click", function () { answers[q.id] = o.v; persist(); render(); });
          g.appendChild(b);
        });
        wrap.appendChild(g);
      }

      else if (q.type === "choice" || q.type === "multi") {
        var multi = q.type === "multi";
        var longest = q.options.reduce(function (m, o) { return Math.max(m, o.label.length); }, 0);
        var list = el('<div class="opts' + (longest > 34 ? " stack" : "") + '"></div>');
        q.options.forEach(function (o) {
          var on = multi ? (answers[q.id] || []).indexOf(o.v) !== -1 : answers[q.id] === o.v;
          var b = el('<button type="button" aria-pressed="' + on + '">' + TICK + esc(o.label) + '</button>');
          b.addEventListener("click", function () {
            if (!multi) { answers[q.id] = o.v; }
            else {
              var cur = answers[q.id] || [];
              // "nothing / none" answers are exclusive — selecting one clears the rest.
              var exclusive = o.v === "none" || o.v === "nothing";
              if (cur.indexOf(o.v) !== -1) cur = cur.filter(function (x) { return x !== o.v; });
              else if (exclusive) cur = [o.v];
              else cur = cur.filter(function (x) { return x !== "none" && x !== "nothing"; }).concat([o.v]);
              answers[q.id] = cur;
            }
            persist(); render();
          });
          list.appendChild(b);
        });
        wrap.appendChild(list);
      }

      else if (q.type === "text") {
        var max = q.maxLength || 1000;
        var ta = el('<textarea maxlength="' + max + '" placeholder="' + esc(q.placeholder || "") + '"></textarea>');
        ta.value = answers[q.id] || "";
        var count = el('<div class="char-count">' + (ta.value.length) + " / " + max + '</div>');
        ta.addEventListener("input", function () {
          answers[q.id] = ta.value;
          count.textContent = ta.value.length + " / " + max;
          persist();
        });
        wrap.appendChild(ta);
        wrap.appendChild(count);
      }

      return wrap;
    }

    var navNext = null;

    // ----- screens -----
    function renderIntro() {
      // Whatever the admin typed, in full — splitting on the first word greets
      // half the testers as "Dr".
      var name = (intro && intro.name) || "";
      var minutes = steps.length > 10 ? "About ten minutes." : "About seven minutes.";
      stage.innerHTML = "";
      var c = el('<div class="card fade-in"></div>');
      c.innerHTML =
        '<div class="center" style="margin-bottom:18px">' + segmentedO(46, 3.4) + '</div>' +
        '<h1 class="step-title center" style="font-size:31px">' +
        (name ? "Thank you, " + esc(name) + "." : "Thank you.") + '</h1>' +
        '<div class="callout"><strong>' + esc(minutes) + '</strong> Mostly taps, and every question is optional — ' +
        'skip anything you have no view on. Your progress saves on this device as you go, so you can stop and come ' +
        'back to the same link. Nothing is sent until you press submit at the end.</div>' +
        '<p class="muted" style="margin-top:18px">Answers go to the Rounds team only.</p>';
      var nav = el('<div class="nav"><span class="spacer"></span></div>');
      var b = el('<button class="btn btn-primary">Start</button>');
      b.addEventListener("click", function () { stepIndex = 1; persist(); render(); });
      nav.appendChild(b);
      c.appendChild(nav);
      stage.appendChild(c);
    }

    function renderStep(step) {
      stage.innerHTML = "";
      var c = el('<div class="card fade-in"></div>');
      // Feature blocks are numbered by their place in *this* survey, so the
      // short variant reads 1,2,3… rather than showing gaps where a section was
      // left out.
      var eyebrow = step.eyebrow || "";
      if (step.isFeature) {
        var n = steps.filter(function (s, i) { return s.isFeature && i <= stepIndex; }).length;
        eyebrow = "Section 3 · Feature " + n;
      }
      var headHTML =
        '<div class="step-eyebrow">' + esc(eyebrow) + '</div>' +
        '<h2 class="step-title">' + esc(step.title) + '</h2>' +
        (step.intro ? '<p class="step-intro">' + esc(step.intro) + '</p>' : "");

      if (step.mock && MOCKS[step.mock]) {
        c.insertAdjacentHTML("beforeend",
          '<div class="feature-head"><div class="feature-copy">' + headHTML + '</div>' +
          '<div class="mock" role="img" aria-label="Illustration of the ' + esc(step.title) + ' screen">' +
          MOCKS[step.mock] + '</div></div>');
      } else {
        c.insertAdjacentHTML("beforeend", headHTML);
      }

      visibleQuestions(step).forEach(function (q) { c.appendChild(renderQuestion(q)); });

      var nav = el('<div class="nav"></div>');
      var back = el('<button class="btn btn-ghost">Back</button>');
      back.addEventListener("click", function () { stepIndex--; persist(); render(); window.scrollTo(0, 0); });
      nav.appendChild(back);
      nav.appendChild(el('<span class="spacer"></span>'));

      var last = stepIndex === steps.length - 1;
      navNext = el('<button class="btn btn-primary">' + (last ? "Submit" : "Next") + '</button>');
      navNext.addEventListener("click", function () {
        if (last) { submit(); return; }
        stepIndex++; persist(); render(); window.scrollTo(0, 0);
      });
      nav.appendChild(navNext);
      c.appendChild(nav);

      // Wipe the draft and go back to the start — mostly for testing a link,
      // but also for anyone who wants to answer again from scratch.
      var reset = el('<button class="btn btn-ghost btn-sm" style="margin-top:14px;border:none;padding:0;' +
        'color:var(--r-text-faint);font-weight:400">Clear my answers and start over</button>');
      reset.addEventListener("click", function () {
        if (!window.confirm("Clear every answer you have given so far and start again?")) return;
        answers = {}; stepIndex = 0; persist(); render(); window.scrollTo(0, 0);
      });
      c.appendChild(reset);
      stage.appendChild(c);
    }

    function submit() {
      navNext.disabled = true;
      navNext.textContent = "Sending…";
      var payload = { answers: answers, durationSec: Math.round((Date.now() - startedAt) / 1000) };
      api("/beta/survey/" + encodeURIComponent(token), { method: "POST", body: payload })
        .then(function () {
          try { localStorage.removeItem(storeKey); } catch (e) {}
          renderDone();
        })
        .catch(function (err) {
          navNext.disabled = false;
          navNext.textContent = "Submit";
          var existing = stage.querySelector(".err");
          if (existing) existing.remove();
          stage.querySelector(".card").appendChild(
            el('<div class="err">' + esc(err.message || "Could not send your answers.") +
              ' Your answers are still saved on this device — try again in a moment.</div>'));
        });
    }

    function renderDone() {
      document.getElementById("progress-fill").style.width = "100%";
      document.getElementById("progress-meta").innerHTML = "";
      stage.innerHTML = "";
      var c = el('<div class="card fade-in center"></div>');
      c.innerHTML =
        '<div style="margin-bottom:18px">' + segmentedO(46, 3.4) + '</div>' +
        '<h1 class="step-title" style="font-size:29px">That is everything.</h1>' +
        '<p class="step-intro" style="margin:0 auto">Thank you. Every answer here gets read.</p>' +
        '<p class="muted" style="margin-top:18px">You can close this tab. Anything else to add, or a problem you ' +
        'would rather describe in person — write to <a href="mailto:hello@getrounds.ca">hello@getrounds.ca</a>.</p>';
      stage.appendChild(c);
    }

    function renderClosed(message) {
      stage.innerHTML = "";
      var c = el('<div class="card fade-in center"></div>');
      c.innerHTML =
        '<div style="margin-bottom:18px">' + segmentedO(40, 3, "var(--r-text-faint)") + '</div>' +
        '<h1 class="step-title" style="font-size:25px">' + esc(message) + '</h1>' +
        '<p class="muted">If you think this is a mistake, reply to the email that sent you here and we will ' +
        'issue a fresh link.</p>';
      stage.appendChild(c);
    }

    function render() {
      setProgress();
      if (stepIndex === 0) renderIntro();
      else renderStep(steps[stepIndex]);
    }

    stage.innerHTML = '<div class="card center muted">Opening your survey…</div>';
    api("/beta/survey/" + encodeURIComponent(token))
      .then(function (data) {
        intro = data;
        steps = stepsForVariant(data.variant);
        if (stepIndex >= steps.length) stepIndex = steps.length - 1;
        if (data.status === "submitted") { renderClosed("You have already sent this one in."); return; }
        render();
      })
      .catch(function (err) {
        renderClosed(err.status === 404 ? "This link is no longer active." :
          "We could not open your survey just now.");
      });
  }

  // =====================================================================
  // ADMIN SIDE
  // =====================================================================
  function runAdmin() {
    var token = null;
    var tab = "invites";
    var testers = [];
    var responses = [];

    try { token = sessionStorage.getItem("rounds_beta_admin_token"); } catch (e) {}

    root.innerHTML = masthead("Beta feedback · admin", true) +
      '<div class="wrap wrap-wide" style="padding-top:26px"><div id="stage"></div></div>';
    var stage = document.getElementById("stage");
    document.getElementById("progress-meta").remove();

    // Sign-in is a code emailed to the admin's own verified address, not a
    // password: an Apple- or Google-only admin has no password to type, and
    // this page is the one place they would need one.
    function renderLogin(message, prefill) {
      stage.innerHTML = "";
      var c = el('<div class="card fade-in" style="max-width:420px;margin:40px auto"></div>');
      c.innerHTML =
        '<div class="step-eyebrow">Admin</div>' +
        '<h2 class="step-title" style="font-size:23px">Sign in</h2>' +
        '<p class="muted" style="margin-bottom:18px">Enter the email on your Rounds admin account. ' +
        'We will send you a six-digit code.</p>';
      var form = el('<form></form>');
      form.innerHTML =
        '<label style="font-size:12px;font-weight:600;color:var(--r-text-muted)">Email' +
        '<input type="email" name="email" autocomplete="username" required style="margin-top:6px" /></label>';
      form.email.value = prefill || "";
      var btn = el('<button class="btn btn-primary" type="submit" style="width:100%;margin-top:18px">Send code</button>');
      form.appendChild(btn);
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var email = form.email.value.trim();
        btn.disabled = true; btn.textContent = "Sending…";
        api("/beta/admin/request-code", { method: "POST", body: { email: email } })
          .then(function () { renderCodeStep(email); })
          .catch(function (err) {
            btn.disabled = false; btn.textContent = "Send code";
            var old = c.querySelector(".err"); if (old) old.remove();
            c.appendChild(el('<div class="err">' + esc(err.message || "Could not send a code.") + '</div>'));
          });
      });
      c.appendChild(form);
      if (message) c.appendChild(el('<div class="err">' + esc(message) + '</div>'));
      stage.appendChild(c);
    }

    function renderCodeStep(email) {
      stage.innerHTML = "";
      var c = el('<div class="card fade-in" style="max-width:420px;margin:40px auto"></div>');
      c.innerHTML =
        '<div class="step-eyebrow">Admin</div>' +
        '<h2 class="step-title" style="font-size:23px">Check your email</h2>' +
        '<p class="muted" style="margin-bottom:18px">If <strong>' + esc(email) + '</strong> is on an admin ' +
        'account, a six-digit code is on its way. It expires in half an hour.</p>';
      var form = el('<form></form>');
      form.innerHTML =
        '<label style="font-size:12px;font-weight:600;color:var(--r-text-muted)">Code' +
        '<input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" ' +
        'required style="margin-top:6px;letter-spacing:0.3em;font-size:18px;text-align:center" /></label>';
      var btn = el('<button class="btn btn-primary" type="submit" style="width:100%;margin-top:18px">Sign in</button>');
      form.appendChild(btn);
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        btn.disabled = true; btn.textContent = "Signing in…";
        api("/beta/admin/verify-code", {
          method: "POST", body: { email: email, code: form.code.value.trim() }
        }).then(function (data) {
          token = data.token;
          try { sessionStorage.setItem("rounds_beta_admin_token", token); } catch (e) {}
          load();
        }).catch(function (err) {
          btn.disabled = false; btn.textContent = "Sign in";
          var old = c.querySelector(".err"); if (old) old.remove();
          c.appendChild(el('<div class="err">' + esc(err.message || "That code is not valid.") + '</div>'));
        });
      });
      c.appendChild(form);
      var back = el('<button class="btn btn-ghost btn-sm" style="width:100%;margin-top:10px">Use a different email</button>');
      back.addEventListener("click", function () { renderLogin(null, email); });
      c.appendChild(back);
      stage.appendChild(c);
    }

    function load() {
      stage.innerHTML = '<div class="card center muted">Loading…</div>';
      Promise.all([
        api("/admin/beta/testers", { token: token }),
        api("/admin/beta/responses", { token: token })
      ]).then(function (out) {
        testers = out[0]; responses = out[1];
        renderAdmin();
      }).catch(function (err) {
        if (err.status === 401 || err.status === 403) {
          try { sessionStorage.removeItem("rounds_beta_admin_token"); } catch (e) {}
          token = null;
          renderLogin(err.status === 403 ? "That account is not an admin." : "Your session expired.");
          return;
        }
        stage.innerHTML = "";
        stage.appendChild(el('<div class="card"><div class="err" style="margin:0">' +
          esc(err.message || "Could not load.") + '</div></div>'));
      });
    }

    function surveyURL(t) { return location.origin + "/beta/?k=" + t.token; }

    function statusOf(t) {
      if (t.revoked) return { cls: "status-revoked", label: "Revoked" };
      if (t.submittedAt) return { cls: "status-done", label: "Submitted" };
      return { cls: "status-open", label: "Waiting" };
    }

    function renderAdmin() {
      stage.innerHTML = "";

      var head = el('<div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap"></div>');
      head.innerHTML = '<h2 class="step-title" style="font-size:25px;margin:0;flex:1">Beta feedback</h2>';
      var out = el('<button class="btn btn-ghost btn-sm">Sign out</button>');
      out.addEventListener("click", function () {
        try { sessionStorage.removeItem("rounds_beta_admin_token"); } catch (e) {}
        token = null; renderLogin();
      });
      head.appendChild(out);
      stage.appendChild(head);

      var tabs = el('<div class="admin-tabs"></div>');
      [["invites", "Invites (" + testers.length + ")"],
       ["summary", "Summary"],
       ["responses", "Responses (" + responses.length + ")"]].forEach(function (t) {
        var b = el('<button type="button" aria-pressed="' + (tab === t[0]) + '">' + esc(t[1]) + '</button>');
        b.addEventListener("click", function () { tab = t[0]; renderAdmin(); });
        tabs.appendChild(b);
      });
      stage.appendChild(tabs);

      if (tab === "invites") renderInvites();
      else if (tab === "summary") renderSummary();
      else renderResponses();
    }

    // ----- invites -----
    function renderInvites() {
      var add = el('<div class="card"></div>');
      add.innerHTML = '<div class="q-label" style="margin-bottom:12px">Create an invite link</div>';
      var form = el('<form class="form-row"></form>');
      form.innerHTML =
        '<label>Name<input type="text" name="name" required placeholder="Dr Sarah Chen" /></label>' +
        '<label>Email <span style="font-weight:400;color:var(--r-text-faint)">(so you can send it)</span>' +
        '<input type="email" name="email" placeholder="optional" /></label>' +
        '<label>Note<input type="text" name="note" placeholder="e.g. PGY-4, sports" /></label>' +
        '<label>Length<select name="variant" style="width:100%;font-family:inherit;font-size:14.5px;' +
        'margin-top:6px;padding:12px 14px;border:1px solid var(--r-border);border-radius:var(--radius-control);' +
        'background:var(--r-card);color:var(--r-text-primary)">' +
        '<option value="full">Full — every section</option>' +
        '<option value="short">Short — no Save PDF or Library</option></select></label>';
      var btn = el('<button class="btn btn-primary btn-sm" type="submit" style="padding:12px 20px">Create link</button>');
      form.appendChild(btn);
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        btn.disabled = true; btn.textContent = "Creating…";
        api("/admin/beta/testers", {
          method: "POST", token: token,
          body: {
            name: form.name.value.trim(),
            email: form.email.value.trim() || null,
            note: form.note.value.trim() || null,
            variant: form.variant.value
          }
        }).then(function () { load(); })
          .catch(function (err) {
            btn.disabled = false; btn.textContent = "Create link";
            var old = add.querySelector(".err"); if (old) old.remove();
            add.appendChild(el('<div class="err">' + esc(err.message) + '</div>'));
          });
      });
      add.appendChild(form);
      stage.appendChild(add);

      var card = el('<div class="card"></div>');
      if (!testers.length) {
        card.innerHTML = '<div class="center muted" style="padding:22px 0">No invites yet. ' +
          'Create one above and send the link.</div>';
        stage.appendChild(card);
        return;
      }
      var scroll = el('<div class="table-scroll"></div>');
      var table = el('<table><thead><tr><th>Tester</th><th>Note</th><th>Status</th><th>Created</th>' +
        '<th style="text-align:right">Link</th></tr></thead><tbody></tbody></table>');
      var tbody = table.querySelector("tbody");
      testers.forEach(function (t) {
        var s = statusOf(t);
        var tr = el('<tr></tr>');
        tr.innerHTML =
          '<td><div style="font-weight:600">' + esc(t.name) + '</div>' +
          (t.email ? '<div style="font-size:11.5px;color:var(--r-text-faint)">' + esc(t.email) + '</div>' : "") + '</td>' +
          '<td style="color:var(--r-text-muted)">' + esc(t.note || "—") +
          (t.variant === "short" ? '<div style="font-size:11.5px;color:var(--r-text-faint)">short survey</div>' : "") +
          '</td>' +
          '<td><span class="status ' + s.cls + '">' + s.label + '</span></td>' +
          '<td style="color:var(--r-text-faint);font-size:12px">' + esc((t.createdAt || "").slice(0, 10)) + '</td>';
        var actions = el('<td class="actions"></td>');

        var copy = el('<button class="btn btn-ghost btn-sm">Copy link</button>');
        copy.addEventListener("click", function () {
          var url = surveyURL(t);
          var done = function () { copy.textContent = "Copied"; setTimeout(function () { copy.textContent = "Copy link"; }, 1600); };
          if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, function () { window.prompt("Copy this link", url); });
          else window.prompt("Copy this link", url);
        });
        actions.appendChild(copy);

        if (t.submittedAt || t.revoked) {
          var reopen = el('<button class="btn btn-ghost btn-sm" style="margin-left:6px">Reopen</button>');
          reopen.addEventListener("click", function () {
            api("/admin/beta/testers/" + t.id + "/reopen", { method: "POST", token: token }).then(load);
          });
          actions.appendChild(reopen);
        }
        if (!t.revoked) {
          var revoke = el('<button class="btn btn-danger btn-sm" style="margin-left:6px">Revoke</button>');
          revoke.addEventListener("click", function () {
            if (!window.confirm("Deactivate " + t.name + "'s link? Any answers they already sent are kept.")) return;
            api("/admin/beta/testers/" + t.id, { method: "DELETE", token: token }).then(load);
          });
          actions.appendChild(revoke);
        }
        tr.appendChild(actions);
        tbody.appendChild(tr);
      });
      scroll.appendChild(table);
      card.appendChild(scroll);
      stage.appendChild(card);
    }

    // ----- summary -----
    function valuesFor(qid) {
      var out = [];
      responses.forEach(function (r) {
        var v = r.answers[qid];
        if (v === undefined || v === null || v === "") return;
        if (Array.isArray(v)) v.forEach(function (x) { out.push(x); });
        else out.push(v);
      });
      return out;
    }

    function barBlock(qid, label) {
      var vals = valuesFor(qid);
      if (!vals.length) return null;
      var counts = {};
      vals.forEach(function (v) { counts[v] = (counts[v] || 0) + 1; });
      var keys = Object.keys(counts).sort(function (a, b) {
        var na = Number(a), nb = Number(b);
        if (!isNaN(na) && !isNaN(nb)) return na - nb;
        return counts[b] - counts[a];
      });
      var max = Math.max.apply(null, keys.map(function (k) { return counts[k]; }));
      var block = el('<div class="summary-row"></div>');
      var numeric = keys.every(function (k) { return !isNaN(Number(k)); });
      var mean = numeric
        ? (vals.reduce(function (s, v) { return s + Number(v); }, 0) / vals.length).toFixed(1)
        : null;
      block.innerHTML = '<div class="summary-q">' + esc(label) +
        (mean !== null ? ' <span style="color:var(--r-teal)">mean ' + mean + '</span>' : "") +
        ' <span style="font-weight:400;color:var(--r-text-faint)">n=' + vals.length + '</span></div>';
      keys.forEach(function (k) {
        var pretty = (OPTION_LABELS[qid] && OPTION_LABELS[qid][k]) || k;
        block.insertAdjacentHTML("beforeend",
          '<div class="bar-line"><span class="bl-label">' + esc(pretty) + '</span>' +
          '<span class="bl-track"><span class="bl-fill" style="width:' + Math.round(counts[k] / max * 100) + '%"></span></span>' +
          '<span class="bl-n">' + counts[k] + '</span></div>');
      });
      return block;
    }

    var FEATURES = [
      ["search", "Search"], ["access", "Full-text access"], ["pdf", "Save PDF"],
      ["digest", "Rounds digest"], ["score", "Evidence Score"], ["library", "Library & notes"],
      ["share", "Share sheet"], ["reminders", "Reminders"]
    ];

    function renderSummary() {
      if (!responses.length) {
        stage.appendChild(el('<div class="card center muted" style="padding:36px 0">' +
          'No responses yet. The summary fills in as they come back.</div>'));
        return;
      }

      // headline numbers
      var nps = valuesFor("nps").map(Number);
      var promoters = nps.filter(function (v) { return v >= 9; }).length;
      var detractors = nps.filter(function (v) { return v <= 6; }).length;
      var npsScore = nps.length ? Math.round((promoters - detractors) / nps.length * 100) : null;
      var durations = responses.map(function (r) { return r.durationSec; }).filter(function (d) { return d; });
      var medianMin = durations.length
        ? (durations.sort(function (a, b) { return a - b; })[Math.floor(durations.length / 2)] / 60).toFixed(1)
        : "—";

      var stats = el('<div class="card"><div class="stat-grid"></div></div>');
      var grid = stats.querySelector(".stat-grid");
      [
        [responses.length + " / " + testers.length, "Responses in"],
        [npsScore === null ? "—" : npsScore, "Net promoter score"],
        [(valuesFor("time_saved").reduce(function (s, v) { return s + Number(v); }, 0) /
          Math.max(1, valuesFor("time_saved").length)).toFixed(1), "“Saved me time” (1–5)"],
        [medianMin + " min", "Median time to complete"]
      ].forEach(function (s) {
        grid.appendChild(el('<div class="stat"><div class="stat-num">' + esc(s[0]) + '</div>' +
          '<div class="stat-label">' + esc(s[1]) + '</div></div>'));
      });
      stage.appendChild(stats);

      // feature adoption
      var adopt = el('<div class="card"><div class="summary-q" style="margin-bottom:12px">Feature use</div></div>');
      FEATURES.forEach(function (f) {
        var vals = valuesFor(f[0] + "_used");
        if (!vals.length) return;
        var yes = vals.filter(function (v) { return v === "yes"; }).length;
        var unaware = vals.filter(function (v) { return v === "unaware"; }).length;
        // Only the 1–5 scales have a mean; the reminders follow-up is a choice,
        // and averaging it would print NaN.
        var ratings = valuesFor(f[0] + "_rating").map(Number).filter(function (n) { return !isNaN(n); });
        var mean = ratings.length
          ? " · " + (ratings.reduce(function (s, v) { return s + v; }, 0) / ratings.length).toFixed(1) + "/5"
          : "";
        adopt.insertAdjacentHTML("beforeend",
          '<div class="bar-line"><span class="bl-label">' + esc(f[1]) + '</span>' +
          '<span class="bl-track"><span class="bl-fill" style="width:' + Math.round(yes / vals.length * 100) + '%"></span></span>' +
          '<span class="bl-n" style="width:auto">' + yes + '/' + vals.length +
          ' used' + mean + (unaware ? ' · ' + unaware + ' unaware' : "") + '</span></div>');
      });
      stage.appendChild(adopt);

      // distributions worth seeing at a glance
      var dist = el('<div class="card"></div>');
      ["core_job", "friction_points", "keep_using", "trust", "role", "frequency"].forEach(function (qid) {
        var b = barBlock(qid, QUESTION_LABELS[qid] || qid);
        if (b) dist.appendChild(b);
      });
      stage.appendChild(dist);

      // free text, gathered
      var textCard = el('<div class="card"><div class="summary-q" style="margin-bottom:6px">In their words</div></div>');
      [["one_change", "Biggest change wanted"], ["friction_detail", "Worst friction"],
       ["missing_feature", "Expected but missing"], ["anything_else", "Anything else"]].forEach(function (t) {
        var quotes = responses.filter(function (r) { return (r.answers[t[0]] || "").trim(); });
        if (!quotes.length) return;
        textCard.insertAdjacentHTML("beforeend",
          '<div class="summary-q" style="margin-top:16px;color:var(--r-text-muted);font-size:12px;' +
          'text-transform:uppercase;letter-spacing:.07em">' + esc(t[1]) + '</div>');
        quotes.forEach(function (r) {
          textCard.insertAdjacentHTML("beforeend",
            '<div class="quote">' + esc(r.answers[t[0]]) + '<cite>' + esc(r.testerName) + '</cite></div>');
        });
      });
      stage.appendChild(textCard);
    }

    // ----- responses -----
    function csvEscape(v) {
      var s = Array.isArray(v) ? v.join("; ") : (v === null || v === undefined ? "" : String(v));
      return '"' + s.replace(/"/g, '""') + '"';
    }

    function exportCSV() {
      var keys = [];
      STEPS.forEach(function (s) { (s.questions || []).forEach(function (q) { keys.push(q.id); }); });
      responses.forEach(function (r) {
        Object.keys(r.answers).forEach(function (k) { if (keys.indexOf(k) === -1) keys.push(k); });
      });
      var header = ["tester", "note", "submitted", "duration_sec"].concat(keys);
      var lines = [header.map(csvEscape).join(",")];
      responses.forEach(function (r) {
        var row = [r.testerName, r.testerNote || "", r.createdAt, r.durationSec || ""]
          .concat(keys.map(function (k) { return r.answers[k]; }));
        lines.push(row.map(csvEscape).join(","));
      });
      var blob = new Blob(["﻿" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "rounds-beta-feedback.csv";
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    }

    function prettyValue(qid, v) {
      if (Array.isArray(v)) {
        return v.map(function (x) { return prettyValue(qid, x); }).join(", ");
      }
      if (OPTION_LABELS[qid] && OPTION_LABELS[qid][v]) return OPTION_LABELS[qid][v];
      return String(v);
    }

    function renderResponses() {
      var card = el('<div class="card"></div>');
      var bar = el('<div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">' +
        '<div class="summary-q" style="flex:1;margin:0">' + responses.length + ' response' +
        (responses.length === 1 ? "" : "s") + '</div></div>');
      var csv = el('<button class="btn btn-ghost btn-sm">Export CSV</button>');
      csv.addEventListener("click", exportCSV);
      bar.appendChild(csv);
      card.appendChild(bar);

      if (!responses.length) {
        card.appendChild(el('<div class="center muted" style="padding:26px 0">Nothing submitted yet.</div>'));
        stage.appendChild(card);
        return;
      }

      responses.forEach(function (r) {
        var d = el('<details class="resp"></details>');
        d.appendChild(el('<summary><span>' + esc(r.testerName) + '</span>' +
          '<span style="font-weight:400;color:var(--r-text-faint);font-size:12px">' +
          esc((r.createdAt || "").slice(0, 10)) +
          (r.durationSec ? " · " + Math.round(r.durationSec / 60) + " min" : "") + '</span></summary>'));
        var body = el('<div class="ans"></div>');
        STEPS.forEach(function (s) {
          (s.questions || []).forEach(function (q) {
            var v = r.answers[q.id];
            if (v === undefined || v === null || v === "" || (Array.isArray(v) && !v.length)) return;
            body.appendChild(el('<div class="ans-row"><span class="ak">' + esc(q.label) + '</span>' +
              '<span class="av">' + esc(prettyValue(q.id, v)) + '</span></div>'));
          });
        });
        d.appendChild(body);
        card.appendChild(d);
      });
      stage.appendChild(card);
    }

    if (token) load(); else renderLogin();
  }

  // =====================================================================
  var k = qs("k");
  if (k) runSurvey(k); else runAdmin();
})();
</script>
</body>
</html>
